<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#0c4a6e"/>
  <!-- Body/suit -->
  <ellipse cx="50" cy="85" rx="28" ry="20" fill="#e2e8f0"/>
  <!-- Suit details -->
  <rect x="44" y="70" width="12" height="8" rx="2" fill="#bae6fd"/>
  <circle cx="38" cy="75" r="3" fill="#7dd3fc"/>
  <circle cx="62" cy="75" r="3" fill="#7dd3fc"/>
  <!-- Helmet outer -->
  <circle cx="50" cy="46" r="24" fill="#cbd5e1"/>
  <!-- Helmet visor -->
  <ellipse cx="50" cy="46" rx="17" ry="15" fill="#0ea5e9"/>
  <!-- Visor reflection -->
  <ellipse cx="44" cy="40" rx="5" ry="4" fill="#38bdf8" opacity="0.6"/>
  <!-- Face inside visor -->
  <circle cx="50" cy="47" r="11" fill="#fcd9a8"/>
  <!-- Eyes -->
  <circle cx="45" cy="45" r="2.5" fill="#1e293b"/>
  <circle cx="55" cy="45" r="2.5" fill="#1e293b"/>
  <circle cx="45.8" cy="44.2" r="0.8" fill="white"/>
  <circle cx="55.8" cy="44.2" r="0.8" fill="white"/>
  <!-- Smile -->
  <path d="M45 51 Q50 55 55 51" stroke="#92400e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Helmet top detail -->
  <rect x="44" y="22" width="12" height="4" rx="2" fill="#94a3b8"/>
  <circle cx="50" cy="22" r="3" fill="#64748b"/>
</svg>
