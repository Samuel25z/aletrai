<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#0f172a"/>
  <!-- Body -->
  <ellipse cx="50" cy="82" rx="26" ry="22" fill="#1e293b"/>
  <!-- Face base -->
  <circle cx="50" cy="48" r="18" fill="#1e293b"/>
  <!-- Mask (covers nose/mouth) -->
  <rect x="32" y="48" width="36" height="18" rx="4" fill="#0f172a"/>
  <!-- Eyes glow -->
  <ellipse cx="43" cy="45" rx="5" ry="4" fill="#dc2626"/>
  <ellipse cx="57" cy="45" rx="5" ry="4" fill="#dc2626"/>
  <ellipse cx="43" cy="45" rx="3" ry="2.5" fill="#7f1d1d"/>
  <ellipse cx="57" cy="45" rx="3" ry="2.5" fill="#7f1d1d"/>
  <!-- Eye glow shine -->
  <circle cx="44.5" cy="44" r="1" fill="#fca5a5"/>
  <circle cx="58.5" cy="44" r="1" fill="#fca5a5"/>
  <!-- Headband -->
  <rect x="32" y="34" width="36" height="8" rx="4" fill="#dc2626"/>
  <!-- Headband knot/symbol -->
  <circle cx="50" cy="38" r="3" fill="#991b1b"/>
  <text x="50" y="40" text-anchor="middle" font-size="4" fill="#fca5a5">忍</text>
  <!-- Hair spikes -->
  <polygon points="35,35 32,22 38,30" fill="#0f172a"/>
  <polygon points="50,30 50,16 53,28" fill="#0f172a"/>
  <polygon points="65,35 68,22 62,30" fill="#0f172a"/>
</svg>
