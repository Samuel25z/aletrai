<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#064e3b"/>
  <!-- Lab coat body -->
  <ellipse cx="50" cy="85" rx="27" ry="20" fill="#f0fdf4"/>
  <!-- Coat lapels -->
  <polygon points="50,65 38,68 35,85" fill="#dcfce7"/>
  <polygon points="50,65 62,68 65,85" fill="#dcfce7"/>
  <!-- Pocket with pen -->
  <rect x="55" y="70" width="10" height="8" rx="1" fill="#d1fae5"/>
  <rect x="58" y="68" width="2" height="5" rx="1" fill="#0ea5e9"/>
  <rect x="62" y="68" width="2" height="5" rx="1" fill="#dc2626"/>
  <!-- Face -->
  <circle cx="50" cy="46" r="18" fill="#fcd9a8"/>
  <!-- Hair - messy scientist -->
  <ellipse cx="50" cy="30" rx="18" ry="10" fill="#92400e"/>
  <path d="M32,34 Q28,24 33,20" stroke="#92400e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M68,34 Q72,24 67,20" stroke="#92400e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M42,28 Q40,18 45,15" stroke="#92400e" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Glasses -->
  <circle cx="43" cy="45" r="7" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="57" cy="45" r="7" fill="none" stroke="#1e293b" stroke-width="2"/>
  <line x1="50" y1="45" x2="50" y2="45" stroke="#1e293b" stroke-width="2"/>
  <path d="M36,45 L34,43" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M64,45 L66,43" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes behind glasses -->
  <circle cx="43" cy="45" r="2.5" fill="#065f46"/>
  <circle cx="57" cy="45" r="2.5" fill="#065f46"/>
  <circle cx="43.8" cy="44.2" r="0.8" fill="white"/>
  <circle cx="57.8" cy="44.2" r="0.8" fill="white"/>
  <!-- Smile -->
  <path d="M44 53 Q50 58 56 53" stroke="#92400e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="50" cy="50" rx="2" ry="1.5" fill="#e8b88a"/>
</svg>
