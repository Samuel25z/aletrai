<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#0f172a"/>
  <!-- Hoodie body -->
  <ellipse cx="50" cy="85" rx="28" ry="20" fill="#1e293b"/>
  <!-- Hoodie front pocket -->
  <path d="M36,72 Q50,68 64,72 L64,85 L36,85 Z" fill="#0f172a"/>
  <!-- Hood shadow -->
  <ellipse cx="50" cy="40" rx="22" ry="18" fill="#1e293b"/>
  <!-- Face -->
  <circle cx="50" cy="46" r="16" fill="#fcd9a8"/>
  <!-- Dark glasses (sunglasses) -->
  <rect x="33" y="41" width="14" height="9" rx="4" fill="#0f172a"/>
  <rect x="53" y="41" width="14" height="9" rx="4" fill="#0f172a"/>
  <line x1="47" y1="45" x2="53" y2="45" stroke="#0f172a" stroke-width="2"/>
  <line x1="33" y1="45" x2="30" y2="44" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="67" y1="45" x2="70" y2="44" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <!-- Glasses green glow -->
  <rect x="34" y="42" width="12" height="7" rx="3" fill="#00ff41" opacity="0.3"/>
  <rect x="54" y="42" width="12" height="7" rx="3" fill="#00ff41" opacity="0.3"/>
  <!-- Green code reflection in glasses -->
  <text x="36" y="48" font-size="4" fill="#00ff41" font-family="monospace">01</text>
  <text x="56" y="48" font-size="4" fill="#00ff41" font-family="monospace">10</text>
  <!-- Smirk -->
  <path d="M46 54 Q52 58 58 54" stroke="#92400e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Stubble -->
  <circle cx="44" cy="56" r="0.8" fill="#92400e" opacity="0.5"/>
  <circle cx="47" cy="57" r="0.8" fill="#92400e" opacity="0.5"/>
  <circle cx="53" cy="57" r="0.8" fill="#92400e" opacity="0.5"/>
  <circle cx="56" cy="56" r="0.8" fill="#92400e" opacity="0.5"/>
  <!-- Green ambient glow -->
  <circle cx="50" cy="46" r="16" fill="#00ff41" opacity="0.05"/>
</svg>
