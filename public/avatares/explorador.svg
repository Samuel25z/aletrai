<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#78350f"/>
  <!-- Body / jacket -->
  <ellipse cx="50" cy="85" rx="27" ry="20" fill="#92400e"/>
  <!-- Jacket pockets -->
  <rect x="36" y="70" width="10" height="8" rx="2" fill="#78350f"/>
  <rect x="54" y="70" width="10" height="8" rx="2" fill="#78350f"/>
  <!-- Map in pocket -->
  <rect x="56" y="68" width="6" height="5" rx="1" fill="#fef3c7"/>
  <!-- Face - tanned -->
  <circle cx="50" cy="47" r="17" fill="#d97706"/>
  <!-- Explorer hat (Indiana Jones style) -->
  <ellipse cx="50" cy="32" rx="22" ry="5" fill="#92400e"/>
  <path d="M34,32 Q34,20 50,18 Q66,20 66,32" fill="#a16207"/>
  <!-- Hat indent -->
  <path d="M42,22 Q50,18 58,22" stroke="#78350f" stroke-width="2" fill="none"/>
  <!-- Hat band -->
  <rect x="34" y="30" width="32" height="4" rx="0" fill="#78350f"/>
  <!-- Eyes - determined -->
  <circle cx="43" cy="47" r="3.5" fill="#1e293b"/>
  <circle cx="57" cy="47" r="3.5" fill="#1e293b"/>
  <circle cx="43" cy="47" r="2" fill="#92400e"/>
  <circle cx="57" cy="47" r="2" fill="#92400e"/>
  <circle cx="44" cy="46" r="1" fill="white"/>
  <circle cx="58" cy="46" r="1" fill="white"/>
  <!-- Eyebrows - thick -->
  <path d="M38 42 Q43 39 48 42" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M52 42 Q57 39 62 42" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Stubble -->
  <ellipse cx="50" cy="56" rx="10" ry="5" fill="#92400e" opacity="0.4"/>
  <!-- Chin dimple -->
  <path d="M48 58 Q50 60 52 58" stroke="#78350f" stroke-width="1" fill="none"/>
  <!-- Nose -->
  <path d="M47 51 L50 54 L53 51" stroke="#b45309" stroke-width="1.2" fill="none"/>
  <!-- Scar on cheek -->
  <path d="M58 50 L62 55" stroke="#b45309" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- Compass on jacket -->
  <circle cx="50" cy="75" r="4" fill="#fbbf24"/>
  <circle cx="50" cy="75" r="2.5" fill="#1e293b"/>
  <polygon points="50,72 51,75 50,78 49,75" fill="#dc2626"/>
  <polygon points="47,75 50,74 53,75 50,76" fill="#e2e8f0"/>
</svg>
