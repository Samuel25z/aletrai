<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#1c1917"/>
  <!-- Body -->
  <ellipse cx="50" cy="85" rx="27" ry="20" fill="#292524"/>
  <!-- Coat -->
  <polygon points="35,68 50,62 65,68 62,85 38,85" fill="#7c2d12"/>
  <!-- Coat buttons -->
  <circle cx="50" cy="70" r="1.5" fill="#fbbf24"/>
  <circle cx="50" cy="75" r="1.5" fill="#fbbf24"/>
  <circle cx="50" cy="80" r="1.5" fill="#fbbf24"/>
  <!-- Face -->
  <circle cx="50" cy="47" r="17" fill="#fcd9a8"/>
  <!-- Eyepatch strap -->
  <path d="M33,43 Q50,38 67,43" stroke="#1c1917" stroke-width="3" fill="none"/>
  <!-- Eyepatch -->
  <ellipse cx="43" cy="45" rx="7" ry="6" fill="#1c1917"/>
  <ellipse cx="43" cy="45" rx="5" ry="4" fill="#0c0a09"/>
  <!-- Open eye -->
  <circle cx="57" cy="45" r="3.5" fill="#1e293b"/>
  <circle cx="57" cy="45" r="2" fill="#b45309"/>
  <circle cx="58" cy="44" r="1" fill="white"/>
  <!-- Scar across eyepatch -->
  <path d="M39 40 L47 50" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Hat -->
  <path d="M28,36 L72,36 L68,28 L32,28 Z" fill="#1c1917"/>
  <rect x="24" y="34" width="52" height="5" rx="2" fill="#292524"/>
  <!-- Skull on hat -->
  <circle cx="50" cy="25" r="5" fill="#e2e8f0"/>
  <circle cx="48" cy="24" r="1.2" fill="#1c1917"/>
  <circle cx="52" cy="24" r="1.2" fill="#1c1917"/>
  <rect x="47" y="27" width="6" height="2" rx="0.5" fill="#1c1917"/>
  <!-- Beard -->
  <path d="M37,56 Q43,64 50,65 Q57,64 63,56" fill="#92400e"/>
  <!-- Mustache -->
  <path d="M43,52 Q47,55 50,52 Q53,55 57,52" fill="#78350f"/>
  <!-- Smile/smirk -->
  <path d="M44,54 Q50,59 56,54" stroke="#fcd9a8" stroke-width="1" fill="none"/>
</svg>
