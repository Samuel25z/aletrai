<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#1a2e05"/>
  <!-- Robe -->
  <ellipse cx="50" cy="85" rx="27" ry="20" fill="#365314"/>
  <!-- Robe front -->
  <polygon points="40,67 50,60 60,67 58,85 42,85" fill="#4d7c0f"/>
  <!-- Nature symbol -->
  <circle cx="50" cy="72" r="5" fill="#1a2e05"/>
  <path d="M50,68 Q54,70 52,74 Q50,76 48,74 Q46,70 50,68Z" fill="#86efac"/>
  <!-- Hood -->
  <path d="M28,46 Q28,22 50,20 Q72,22 72,46 L68,50 Q68,30 50,28 Q32,30 32,50 Z" fill="#365314"/>
  <!-- Hood shadow -->
  <ellipse cx="50" cy="36" rx="18" ry="12" fill="#1a2e05" opacity="0.5"/>
  <!-- Face - weathered -->
  <circle cx="50" cy="48" r="16" fill="#d4a96a"/>
  <!-- Wise old eyes -->
  <ellipse cx="43" cy="46" rx="4.5" ry="3.5" fill="#1a2e05"/>
  <ellipse cx="57" cy="46" rx="4.5" ry="3.5" fill="#1a2e05"/>
  <ellipse cx="43" cy="46" rx="3" ry="2.2" fill="#4d7c0f"/>
  <ellipse cx="57" cy="46" rx="3" ry="2.2" fill="#4d7c0f"/>
  <circle cx="44" cy="45" r="1" fill="white"/>
  <circle cx="58" cy="45" r="1" fill="white"/>
  <!-- Wrinkles -->
  <path d="M36 44 Q40 42 44 44" stroke="#a37a4a" stroke-width="0.8" fill="none"/>
  <path d="M56 44 Q60 42 64 44" stroke="#a37a4a" stroke-width="0.8" fill="none"/>
  <!-- White beard -->
  <path d="M38,56 Q43,66 50,68 Q57,66 62,56 L58,54 Q54,62 50,63 Q46,62 42,54 Z" fill="#f1f5f9"/>
  <!-- White mustache -->
  <ellipse cx="50" cy="54" rx="8" ry="3" fill="#e2e8f0"/>
  <!-- Staff peeking -->
  <rect x="68" y="20" width="5" height="60" rx="2.5" fill="#78350f"/>
  <circle cx="70" cy="20" r="6" fill="#1a2e05"/>
  <path d="M67,16 Q70,10 73,16 Q70,20 67,16Z" fill="#86efac"/>
</svg>
