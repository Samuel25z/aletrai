  <rect x="57" y="53.5" width="4" height="2" rx="1" fill="#0ea5e9"/>
  <!-- Antenna -->
  <rect x="48" y="18" width="4" height="12" rx="2" fill="#475569"/>
  <circle cx="50" cy="16" r="4" fill="#0ea5e9"/>
  <circle cx="50" cy="16" r="2" fill="#bae6fd"/>
  <!-- Side bolts -->
