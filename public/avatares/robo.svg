<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#1e293b"/>
  <!-- Body -->
  <rect x="30" y="65" width="40" height="25" rx="6" fill="#334155"/>
  <!-- Body details -->
  <rect x="38" y="72" width="8" height="5" rx="1" fill="#0ea5e9"/>
  <rect x="54" y="72" width="8" height="5" rx="1" fill="#22c55e"/>
